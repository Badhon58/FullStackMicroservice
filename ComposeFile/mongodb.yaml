services:
  mongodb:
    image: mongo:latest
    container_name: ${CONTAINER_PREFIX}mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=badhon118
      - MONGO_INITDB_DATABASE=html
      - TZ=${TZ}
    restart: always
volumes:
  mongodb_data:
