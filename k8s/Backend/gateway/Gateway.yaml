apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: badhon58/backend:gateway
          resources:
            requests:
              memory: "100Mi"
              cpu: "350m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 5000
          env:
            - name: GATEWAY_PORT
              value: "5000"
            - name: ENVIRONMENT
              value: LIVE
            - name: NATS_URL_LIVE
              value: nats://nats:4222

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 32000
